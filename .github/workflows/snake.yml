name: Generate Snake

on:
  schedule:
    # run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: JISHU-GHOSH
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#C77DFF&color_dots=#120d1c,#3c096c,#5a189a,#7b2cbf,#c77dff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C77DFF&color_dots=#120d1c,#3c096c,#5a189a,#7b2cbf,#c77dff

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
